<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#121519">
<title>Cuaderno de Hierro</title>
<style>
@font-face{font-family:'Big Shoulders Display';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
.sync{display:none!important}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ok)} .switch.on i{left:21px}
.remrow{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.remrow.off{opacity:.55}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;width:1px;height:1px}
.daypick span{display:flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--line);font-weight:700}
.daypick input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* Layout: app de una columna (máx 560px), barra inferior fija, temporizador flotante; modo reloj = una serie por pantalla.
   Color por grupo muscular como los discos olímpicos: verde piernas, rojo empuje, azul tracción; acento amarillo de disco de 15 kg. */
:root{
  --bg:#121519; --surface:#1a1e24; --surface2:#232931; --line:#303740;
  --fg:#e8ebee; --muted:#97a0aa; --accent:#f2c230; --accent-ink:#1d1700;
  --legs:#41b06d; --push:#e5574e; --pull:#4f93e3; --ok:#41b06d; --bad:#e5574e;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Roboto Mono",monospace;
  --r:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eceef1; --surface:#ffffff; --surface2:#f2f4f6; --line:#d5dae0;
    --fg:#14181d; --muted:#5b6570; --accent:#efb81d; --accent-ink:#1d1700;
    --legs:#23834b; --push:#c3362e; --pull:#2a6ec1; --ok:#23834b; --bad:#c3362e;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eceef1; --surface:#ffffff; --surface2:#f2f4f6; --line:#d5dae0;
  --fg:#14181d; --muted:#5b6570; --accent:#efb81d; --accent-ink:#1d1700;
  --legs:#23834b; --push:#c3362e; --pull:#2a6ec1; --ok:#23834b; --bad:#c3362e;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:12px 150px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:19px;font-weight:700}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.t-Piernas{--tc:var(--legs)} .t-Empuje{--tc:var(--push)} .t-Tracción{--tc:var(--pull)}
.dot[class*="t-"]{background:var(--tc)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:700;background:var(--surface2);border:1px solid var(--line);min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.icon-btn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:var(--surface2);flex:none}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync .dot{background:var(--muted)} .sync.cloud .dot{background:var(--ok)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
/* figuras de técnica */
:root{--eq:#6d7783;--eq2:#2a3038}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--eq:#8a939d;--eq2:#e3e7eb}}
:root[data-theme="light"]{--eq:#8a939d;--eq2:#e3e7eb}
.fig-svg{width:100%;height:auto;display:block;--hl:var(--tc)}
.fig{background:var(--surface2);border-radius:12px;padding:8px;border:1px solid var(--line)}
.fig-ctrl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fig-ctrl .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.how-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how-list.bad li::marker{color:var(--bad)}
.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.guide button{text-align:left;padding:8px;gap:6px}
.guide .fig{padding:4px}
.guide .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.how-btn{color:var(--accent)}
.vid{color:var(--fg);font-weight:600}
.nav button{padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:22px;height:22px}

/* day cards */
.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.wd{font-family:var(--f-display);font-weight:800;font-size:22px;width:52px;height:52px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.day.next .wd{background:var(--accent);color:var(--accent-ink)}
.bars{display:flex;gap:3px;margin-top:6px}
.bars i{height:5px;flex:1;border-radius:3px;background:var(--tc)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:38px;text-transform:uppercase;line-height:1}

/* session */
.sess-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.ex{border-left:4px solid var(--tc)}
.ex.complete{opacity:.75}
.target{display:flex;flex-wrap:wrap;gap:6px}
.sugg{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface2);display:flex;gap:8px;align-items:flex-start}
.sugg.up{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.sugg b{color:var(--fg)}
.sets{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center}
.rir{display:block;font-size:10px;letter-spacing:.04em;color:var(--muted);font-family:var(--f-body);font-weight:600}
.remind{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));font-size:13.5px}
.sups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sup{display:flex;gap:8px;align-items:center;text-align:left;padding:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);min-width:0}
.sup small{display:block;color:var(--muted);font-size:11.5px}
.sup b{font-size:13px}
.sup .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sup.on{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.sup.on .box{background:var(--ok);border-color:transparent;color:#fff}
.streak{background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}
.water{display:flex;flex-direction:column;gap:8px}
.wbar{position:relative;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.wbar i{position:absolute;inset:0 auto 0 0;background:var(--pull);border-radius:6px}
.wbar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.5}
.calc-t{width:100%;border-collapse:collapse;font-size:13px}
.calc-t td{padding:4px 0;border-top:1px solid var(--line)}
.calc-t td:last-child{text-align:right;font-family:var(--f-num)}
.rec td{padding:6px 0;border-top:1px solid var(--line);font-size:13px;vertical-align:top}
.rec td:nth-child(2){text-align:right;font-family:var(--f-num);white-space:nowrap}
.rec small{display:block;color:var(--muted);font-size:11.5px}
.up-pct{color:var(--ok);font-weight:700}
.prof{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.prof .v{font-family:var(--f-num);font-weight:700;font-size:17px}
.supgrid{display:grid;grid-template-columns:70px repeat(14,1fr);gap:3px;align-items:center;font-size:11px}
.supgrid i{aspect-ratio:1;border-radius:3px;background:var(--surface2);max-width:100%}
.supgrid i.on{background:var(--ok)} .supgrid i.half{background:color-mix(in srgb,var(--pull) 55%,var(--surface2))} .supgrid i.full{background:var(--pull)}
@media (max-width:380px){.sups{grid-template-columns:1fr}.prof{grid-template-columns:repeat(2,1fr)}}
.sets .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.sets input{text-align:center;font-family:var(--f-num);font-size:17px;padding:9px 4px}
.sets .n{font-family:var(--f-num);color:var(--muted);text-align:center}
.check{width:44px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.check.on{background:var(--ok);border-color:transparent;color:#fff}
.done-row input{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25;padding-inline:16px;pointer-events:none}
.rest-in{max-width:560px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.rest-in .t{font-family:var(--f-num);font-size:28px;font-weight:700;min-width:84px}
.rest-in.go{background:var(--accent);color:var(--accent-ink)}
.rest-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 30%,transparent);overflow:hidden;margin-top:4px}
.rest-bar i{display:block;height:100%;background:var(--accent)}
.rest-in .btn{background:transparent;border-color:currentColor;color:inherit;min-height:34px;padding:4px 10px}

/* plans */
.ex-line{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.ex-line:first-of-type{border-top:0}
.ex-line .o{font-family:var(--f-num);color:var(--muted);font-size:12px}
.ex-line .meta{font-size:12.5px;color:var(--muted)}
.edit-tools{display:flex;gap:4px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding-inline:0}
.sheet-card{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--f-num);font-size:22px;font-weight:700}
.vol-row{display:grid;grid-template-columns:76px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.vol-track{position:relative;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.vol-track .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 18%,transparent);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.vol-track .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--tc)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* history */
.hist summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.hist summary::-webkit-details-marker{display:none}
.hist table{width:100%;border-collapse:collapse;font-size:13px}
.hist td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.hist td:last-child{text-align:right;font-family:var(--f-num)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}

/* ===== Modo reloj ===== */
.watch body,body.watch{font-size:14px;padding-inline:10px}
body.watch .app{padding-block:14px 20px;gap:10px;max-width:420px;text-align:center}
body.watch .nav{display:none}
body.watch .rest{bottom:0;padding-inline:0}
body.watch .rest-in{border-radius:0;flex-direction:column;gap:6px;min-height:100%;justify-content:center}
.w-ex{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.w-set{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.w-val{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:6px}
.w-val .v{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1}
.w-val .u{font-size:11px;color:var(--muted);display:block;letter-spacing:.08em}
.w-val button{height:48px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:24px;font-weight:700}
.w-go{height:56px;border-radius:28px;background:var(--ok);color:#fff;font-weight:800;font-size:18px;width:100%}
.w-nav{display:flex;justify-content:space-between;gap:8px}
.w-nav button{flex:1;padding:10px 0;border-radius:20px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:13px}
.w-hint{font-size:12px;color:var(--muted)}
.w-rest .t{font-size:44px}
@media (max-width:330px){ .tiles{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .check,.btn,.nav button{transition:background .15s,color .15s} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="rest" id="rest" hidden></div>
<nav class="nav" id="nav" aria-label="Secciones"><div class="nav-in">
  <button data-act="tab" data-tab="train" id="nav-train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Entrenar</button>
  <button data-act="tab" data-tab="plans" id="nav-plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Planes</button>
  <button data-act="tab" data-tab="guide" id="nav-guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M12 9l-5 3M12 9l5-3M12 14l-3 7M12 14l3 7"/></svg>Técnica</button>
  <button data-act="tab" data-tab="progress" id="nav-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M5 15l4-5 4 3 6-7"/></svg>Progreso</button>
  <button data-act="tab" data-tab="history" id="nav-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Historial</button>
</div></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================== Biblioteca de técnica con figuras animadas ================== */
const FIGLEN = { torso: 44, thigh: 38, shin: 36, foot: 11, uarm: 26, farm: 24 };
const rad = a => a * Math.PI / 180;
const fadd = (p, a, l) => [p[0] + Math.cos(rad(a)) * l, p[1] + Math.sin(rad(a)) * l];
const f1 = n => n.toFixed(1);
function fik(P, T, a, b, s) {
  const dx = T[0] - P[0], dy = T[1] - P[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const D = Math.min(Math.max(d, Math.abs(a - b) + 0.5), a + b - 0.01);
  const x = (a * a - b * b + D * D) / (2 * D), h = Math.sqrt(Math.max(0, a * a - x * x));
  return [[P[0] + ux * x - s * uy * h, P[1] + uy * x + s * ux * h], [P[0] + ux * D, P[1] + uy * D]];
}
/* utilería de equipo */
const fL = (a, b, w, c = 'var(--eq)') => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const fC = (p, r, f = 'var(--eq2)', s = 'var(--eq)') => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${f}" stroke="${s}" stroke-width="1.5"/>`;
const fR = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--eq2)" stroke="var(--eq)" stroke-width="1.5"/>`;
const fBar = (c, ang, len, w, col) => fL(fadd(c, ang, -len / 2), fadd(c, ang, len / 2), w, col);
const fFloor = (y = 141) => fL([8, y], [192, y], 2, 'var(--line)');

  const dx = p.ankle[0] - p.knee[0], dy = p.ankle[1] - p.knee[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  return fC([p.ankle[0] - ux * 4 + uy * 7, p.ankle[1] - uy * 4 - ux * 7], 5.5);
}

function fSolve(def, q) {
  if (def.rig === 'front') {
    const h = q.hip, sh = [h[0], h[1] - 44], tl = def.thighLen || 38;
    const p = { rig: 'front', hip: h, sh, head: [h[0], sh[1] - 14], shL: [h[0] - 12, sh[1]], shR: [h[0] + 12, sh[1]], hipL: [h[0] - 8, h[1]], hipR: [h[0] + 8, h[1]] };
    p.kneeL = fadd(p.hipL, q.tL, tl); p.ankleL = fadd(p.kneeL, q.sL, 36);
    p.kneeR = fadd(p.hipR, q.tR, tl); p.ankleR = fadd(p.kneeR, q.sR, 36);
    p.elbowL = fadd(p.shL, q.uL, 26); p.handL = fadd(p.elbowL, q.fL, 24);
    p.elbowR = fadd(p.shR, q.uR, 26); p.handR = fadd(p.elbowR, q.fR, 24);
    p.fLa = q.fL; p.fRa = q.fR;
    return p;
  }
  const hip = q.hip, sh = fadd(hip, q.torso, FIGLEN.torso), head = fadd(sh, q.torso, 13);
  const [knee, ankle] = fik(hip, q.ankle, FIGLEN.thigh, FIGLEN.shin, def.k);
  const toe = fadd(ankle, q.foot || 0, FIGLEN.foot);
  const tgt = q.hand || [sh[0] + q.handRel[0], sh[1] + q.handRel[1]];
  const [elbow, hand] = fik(sh, tgt, FIGLEN.uarm, FIGLEN.farm, def.e);
  return { rig: 'side', hip, sh, head, knee, ankle, toe, elbow, hand };
}
function fLerp(A, B, t) {
  const o = {};
  for (const k in A) o[k] = Array.isArray(A[k]) ? A[k].map((v, i) => v + (B[k][i] - v) * t) : (typeof A[k] === 'number' ? A[k] + (B[k] - A[k]) * t : A[k]);

}
function fBody(p, hi, ghost) {
  const col = s => (!ghost && hi.includes(s)) ? 'var(--hl)' : 'var(--fg)';
  let s = '';

    s += fL(p.hip, p.knee, 9.5, col('thigh')) + fL(p.knee, p.ankle, 7.5, col('shin')) + fL(p.ankle, p.toe, 5, 'var(--fg)');
    s += fL(p.hip, p.sh, 12, col('torso'));
    if (!ghost && hi.includes('glute')) s += `<circle cx="${f1(p.hip[0])}" cy="${f1(p.hip[1])}" r="7.5" fill="var(--hl)"/>`;
    s += `<circle cx="${f1(p.head[0])}" cy="${f1(p.head[1])}" r="8.5" fill="var(--fg)"/>`;
    s += fL(p.sh, p.elbow, 7.5, col('uarm')) + fL(p.elbow, p.hand, 6, col('farm'));
    if (!ghost && hi.includes('delt')) s += `<circle cx="${f1(p.sh[0])}" cy="${f1(p.sh[1])}" r="6.5" fill="var(--hl)"/>`;
  } else {
    for (const sd of ['L', 'R']) s += fL(p['hip' + sd], p['knee' + sd], 9, col('thigh')) + fL(p['knee' + sd], p['ankle' + sd], 7.5, col('shin'));
    s += fL(p.hip, p.sh, 22, col('torso')) + fL(p.hipL, p.hipR, 10, col('torso')) + fL(p.shL, p.shR, 8, col('torso'));
    if (!ghost && hi.includes('glute')) s += fC(p.hipL, 6, 'var(--hl)', 'none') + fC(p.hipR, 6, 'var(--hl)', 'none');
    s += `<circle cx="${f1(p.head[0])}" cy="${f1(p.head[1])}" r="8.5" fill="var(--fg)"/>`;
    for (const sd of ['L', 'R']) s += fL(p['sh' + sd], p['elbow' + sd], 7, col('uarm')) + fL(p['elbow' + sd], p['hand' + sd], 6, col('farm'));
    if (!ghost && hi.includes('delt')) s += fC(p.shL, 6, 'var(--hl)', 'none') + fC(p.shR, 6, 'var(--hl)', 'none');

}

}

let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach((t, k) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = k === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.2, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.18);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.2); });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) {}
}
function startRest(sec) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {}
  state.rest = { end: Date.now() + sec * 1000, total: sec, rang: false }; tick();
}
function tick() {
  const el = $('#rest'); const r = state.rest;
  if (!r) { el.hidden = true; el.innerHTML = ''; return; }
  const left = Math.max(0, (r.end - Date.now()) / 1000);
  if (left <= 0 && !r.rang) { r.rang = true; beep(); }
  if (left <= 0 && Date.now() - r.end > 6000) { state.rest = null; el.hidden = true; return; }
  const pct = Math.min(100, (1 - left / r.total) * 100);
  el.hidden = false;
  const go = left <= 0;
  el.innerHTML = `<div class="rest-in ${go ? 'go' : ''} ${isWatch() ? 'w-rest' : ''}">
    <div class="grow"><div class="label" style="color:inherit;opacity:.75">${go ? '¡A la siguiente serie!' : 'Descanso'}</div>
      <div class="t num">${go ? '0:00' : clock(Math.ceil(left))}</div>
      <div class="rest-bar"><i style="width:${pct}%"></i></div></div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="rest-add">+15 s</button><button class="btn" data-act="rest-skip">${go ? 'Cerrar' : 'Saltar'}</button></div></div>`;
}
setInterval(() => { tick(); const el = $('#elapsed'); if (el && state.draft) el.textContent = clock((Date.now() - new Date(state.draft.start)) / 1000); }, 250);

function reminders() {

function calcOut() {

  <table class="calc-t">${rows.map(([p, rr]) => `<tr><td>${p}% · unas ${rr} reps</td><td>${fmtKg(Math.round(one * p / 100 / 2.5) * 2.5)} kg</td></tr>`).join('')}</table>`;

function countPRs() {

  HISTORY.records.forEach(r => best[r.name] = e1rm(r.w, r.r));

}
function exChart(name) {
  const pts = [...state.sessions].reverse().map(s => { const e = s.exercises.find(x => x.name === name); if (!e || !e.sets.length) return null;
    const top = e.sets.reduce((a, x) => x.w > a.w || (x.w === a.w && x.r > a.r) ? x : a, e.sets[0]);
    return { d: s.date, w: top.w, r: top.r, e: Math.max(...e.sets.map(x => e1rm(x.w, x.r))) }; }).filter(Boolean);
  if (!pts.length) return '';

  const lo = Math.floor(Math.min(...pts.map(p => p.w)) * 0.9), hi = Math.ceil(Math.max(...pts.map(p => p.e)) * 1.05);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progreso de ${esc(name)}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12" stroke="none"/>
    <path d="${line('e')}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${line('w')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.w)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
    <text x="${L}" y="${H - 6}">${fmtDate(pts[0].d)}</text>${pts.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(lastP.d)}</text>` : ''}
  </svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>Mejor serie (kg)</span><span><i style="background:var(--muted)"></i>1RM estimado</span></div>
  <div class="grid2" style="font-size:13px"><div><div class="label">Última</div><div class="num">${fmtKg(lastP.w)} kg × ${lastP.r}</div></div>
  <div><div class="label">1RM estimado máx.</div><div class="num">${fmtKg(best.e)} kg</div></div></div>`;
}

function vGuide() {

  const others = LIB.filter(x => !mine.includes(x));
  const card = x => `<button class="card" data-act="how" data-name="${esc(x.name)}"><div class="fig">${figSVG(x, 1)}</div>

const figAnim = { item: null, t0: 0, playing: true, fixed: null };
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function figT(ms) {
  const c = (ms % 3600) / 3600; const sm = x => x * x * (3 - 2 * x);
  if (c < .15) return 0; if (c < .5) return sm((c - .15) / .35); if (c < .65) return 1; return 1 - sm((c - .65) / .35);
}
function figLoop(now) {
  const el = document.getElementById('fig-live');
  if (!el || !figAnim.item) return;
  if (figAnim.playing) el.innerHTML = figSVG(figAnim.item, figT(now - figAnim.t0));
  requestAnimationFrame(figLoop);
}
function figShow(t) { const el = document.getElementById('fig-live'); if (el) el.innerHTML = figSVG(figAnim.item, t); }
function figCtrl() {
  const c = document.querySelector('.fig-ctrl'); if (!c) return;
  c.querySelectorAll('[data-act]').forEach(b => b.setAttribute('aria-pressed', String(
    (b.dataset.act === 'fig-play' && figAnim.playing) || (!figAnim.playing && b.dataset.act === 'fig-a' && figAnim.fixed === 0) || (!figAnim.playing && b.dataset.act === 'fig-b' && figAnim.fixed === 1))));
}

/* ================== Eventos ================== */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.act, pid = b.dataset.plan, did = b.dataset.day;
  const keepConfirm = ['finish', 'discard', 'plan-del', 'sess-del', 'reset-plans', 'ex-del', 'day-del'];
  const prevConfirm = state.confirm; if (!keepConfirm.includes(a)) state.confirm = null;
  switch (a) {
    case 'tab': state.tab = b.dataset.tab; render(); scrollTo(0, 0); break;
    case 'watch': state.settings.watch = !isWatch(); saveLocal(); render(); break;
    case 'watch-off': state.settings.watch = false; saveLocal(); render(); break;
    case 'start':
      if (state.draft) { state.tab = 'train'; render(); toast('Ya tienes una sesión en curso.'); break; }
      startSession(pid, did); break;
    case 'set': markSet(+b.dataset.ex, +b.dataset.set, b.dataset.val ? true : undefined); break;
    case 'add-set': { const e = state.draft.exercises[+b.dataset.ex]; const l = e.log[e.log.length - 1]; e.log.push({ w: l ? l.w : e.sugg.w, r: null, done: false }); saveDraft(); render(); break; }
    case 'rm-set': { const e = state.draft.exercises[+b.dataset.ex]; e.log.pop(); saveDraft(); render(); break; }
    case 'w-adj': {
      const d = state.draft, e = d.exercises[d.cur]; const s = e.log.find(x => !x.done); if (!s) break;
      if (b.dataset.f === 'w') s.w = Math.max(0, (+s.w || 0) + e.inc * +b.dataset.d);
      else s.r = Math.max(0, (s.r ?? e.repsMax) + +b.dataset.d);
      saveDraft(); render(); break; }
    case 'w-prev': state.draft.cur = Math.max(0, state.draft.cur - 1); saveDraft(); render(); break;
    case 'w-next': state.draft.cur = Math.min(state.draft.exercises.length - 1, state.draft.cur + 1); saveDraft(); render(); break;
    case 'finish': if (prevConfirm === 'finish') finishSession(); else { state.confirm = 'finish'; render(); } break;
    case 'discard': if (prevConfirm === 'discard') discardSession(); else { state.confirm = 'discard'; render(); } break;
    case 'rest-add': if (state.rest) { state.rest.end = Math.max(Date.now(), state.rest.end) + 15000; state.rest.total += 15; state.rest.rang = false; tick(); } break;
    case 'rest-skip': state.rest = null; tick(); break;
    case 'activate': state.settings.activePlanId = pid; savePlans(); render(); toast('Plan activo cambiado.'); break;
    case 'edit-plan': state.editPlan = state.editPlan === pid ? null : pid; render(); break;
    case 'ex-up': { const { d } = findDay(pid, did); const k = +b.dataset.k; [d.exercises[k - 1], d.exercises[k]] = [d.exercises[k], d.exercises[k - 1]]; savePlans(); render(); break; }
    case 'ex-edit': exSheet(pid, did, +b.dataset.k); break;
    case 'ex-new': exSheet(pid, did, null); break;
    case 'ex-del': if (prevConfirm === 'exdel') { const { d } = findDay(pid, did); d.exercises.splice(+b.dataset.k, 1); state.confirm = null; savePlans(); closeSheet(); render(); } else { state.confirm = 'exdel'; b.textContent = '¿Quitar? Toca otra vez'; } break;
    case 'edit-day': daySheet(pid, did); break;
    case 'day-new': daySheet(pid, null); break;
    case 'day-del': if (prevConfirm === 'ddel') { const { p } = findDay(pid, did); p.days = p.days.filter(x => x.id !== did); state.confirm = null; savePlans(); closeSheet(); render(); } else { state.confirm = 'ddel'; b.textContent = '¿Borrar día? Toca otra vez'; } break;
    case 'plan-rename': { const p = state.plans.find(x => x.id === pid); textSheet('Renombrar plan', 'Nombre', p.name, v => { p.name = v; }); break; }
    case 'plan-dup': { const p = state.plans.find(x => x.id === pid); const c = JSON.parse(JSON.stringify(p)); c.id = uid(); c.name = p.name + ' (copia)'; c.days.forEach(d => { d.id = uid(); d.exercises.forEach(e => e.id = uid()); }); state.plans.push(c); state.editPlan = c.id; savePlans(); render(); break; }
    case 'plan-del': if (prevConfirm === 'pdel-' + pid) { state.plans = state.plans.filter(x => x.id !== pid); if (state.settings.activePlanId === pid) state.settings.activePlanId = state.plans[0].id; state.confirm = null; savePlans(); render(); } else { state.confirm = 'pdel-' + pid; render(); } break;
    case 'plan-new': textSheet('Nuevo plan', 'Nombre del plan', '', v => { const np = { id: uid(), name: v, days: [{ id: uid(), name: 'Día 1', weekday: 1, exercises: [] }] }; state.plans.push(np); state.editPlan = np.id; }); break;
    case 'reset-plans': if (prevConfirm === 'reset') { state.plans = applyRev2(defaultPlans()); state.settings.activePlanId = 'plan1'; state.confirm = null; savePlans(); render(); toast('Planes originales restaurados.'); } else { state.confirm = 'reset'; render(); } break;
    case 'sess-del': { const id = b.dataset.id; if (prevConfirm === 'sdel-' + id) { state.sessions = state.sessions.filter(s => s.id !== id); state.confirm = null; saveLocal(); cloud.delSession(id); render(); } else { state.confirm = 'sdel-' + id; b.textContent = '¿Borrar? Toca otra vez'; ev.preventDefault(); } break; }
    case 'sheet-close': state.confirm = null; figAnim.item = null; closeSheet(); break;
    case 'how': howSheet(b.dataset.name); break;
    case 'sup': { const t = today(); t[b.dataset.k] = !t[b.dataset.k]; t.edited = Date.now(); saveDaily(); render(); if (t[b.dataset.k] && b.dataset.k === 'crea') toast(`Creatina registrada · ${creaStreak()} días seguidos`); break; }
    case 'water': { const t = today(); t.water = Math.max(0, (t.water || 0) + +b.dataset.ml); t.edited = Date.now(); saveDaily(); render(); if (+b.dataset.ml > 0 && t.water >= WATER_MIN && t.water - +b.dataset.ml < WATER_MIN) toast('¡Meta de agua cumplida! 💧'); break; }
    case 'fig-play': if (!figAnim.playing) { figAnim.playing = true; figAnim.t0 = performance.now(); requestAnimationFrame(figLoop); } figCtrl(); break;
    case 'fig-a': figAnim.playing = false; figAnim.fixed = 0; figShow(0); figCtrl(); break;
    case 'fig-b': figAnim.playing = false; figAnim.fixed = 1; figShow(1); figCtrl(); break;
  }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { state.confirm = null; closeSheet(); } });
document.addEventListener('submit', ev => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === 'f-ex') {
    const fd = new FormData(f); const { d } = findDay(f.dataset.plan, f.dataset.day);
    const num = (k, def) => { const v = parseFloat(String(fd.get(k)).replace(',', '.')); return isFinite(v) ? v : def; };
    let a = Math.round(num('repsMin', 8)), bb = Math.round(num('repsMax', a)); if (bb < a) [a, bb] = [bb, a];
    const e = { name: String(fd.get('name')).trim(), type: fd.get('type'), weight: num('weight', 0), sets: Math.max(1, Math.round(num('sets', 3))), repsMin: a, repsMax: bb, rest: +fd.get('rest') };
    if (f.dataset.k !== '') Object.assign(d.exercises[+f.dataset.k], e); else d.exercises.push(Object.assign({ id: uid() }, e));
    savePlans(); closeSheet(); render(); toast('Ejercicio guardado.');
  }
  if (f.id === 'f-text') { const v = f.querySelector('#ft-v').value.trim(); if (!v) return; textSheet.cb(v, f); savePlans(); closeSheet(); render(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'calc-w' || t.id === 'calc-r') { state[t.id === 'calc-w' ? 'calcW' : 'calcR'] = t.value; $('#calc-out').innerHTML = calcOut(); return; }
  if (t.dataset.f && t.dataset.ex != null && state.draft) {
    const s = state.draft.exercises[+t.dataset.ex].log[+t.dataset.set];
    const v = t.value.replace(',', '.'); s[t.dataset.f] = v === '' ? null : (isFinite(+v) ? +v : s[t.dataset.f]); saveDraft();
  }
});
document.addEventListener('change', ev => { if (ev.target.id === 'sel-ex') { state.progEx = ev.target.value; render(); } });
addEventListener('resize', () => { if (state.settings.watch === null) safeRender(); });

const hadPlans = !!LS.get('plans', null);
if (migratePlans() && hadPlans) toast('Planes actualizados: Curl Femoral y Face Pull agregados.');
render();
cloud.init();
</script>
<script src="native.js"></script>
</body>
</html>

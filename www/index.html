<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Forja</title>
<script>
/* Compatibilidad con WebView antiguos (reloj) y aviso de error en pantalla. Solo ES5 aquí. */
(function () {
  var AP = Array.prototype, SP = String.prototype;
  if (!AP.flat) AP.flat = function (d) { d = d === undefined ? 1 : d; var o = []; (function f(a, n) { for (var i = 0; i < a.length; i++) { if (Array.isArray(a[i]) && n > 0) f(a[i], n - 1); else o.push(a[i]); } })(this, d); return o; };
  if (!AP.flatMap) AP.flatMap = function (fn, t) { return AP.map.call(this, fn, t).flat(1); };
  if (!SP.padStart) SP.padStart = function (n, s) { var r = String(this); s = s === undefined ? ' ' : String(s); while (r.length < n) r = s + r; return r.slice(r.length - Math.max(n, String(this).length)); };
  if (!SP.padEnd) SP.padEnd = function (n, s) { var r = String(this); s = s === undefined ? ' ' : String(s); while (r.length < n) r += s; return r.slice(0, Math.max(n, String(this).length)); };
  if (!Object.entries) Object.entries = function (o) { return Object.keys(o).map(function (k) { return [k, o[k]]; }); };
  if (!Object.values) Object.values = function (o) { return Object.keys(o).map(function (k) { return o[k]; }); };
  if (!Object.fromEntries) Object.fromEntries = function (a) { var o = {}; Array.from(a).forEach(function (p) { o[p[0]] = p[1]; }); return o; };
  if (window.Promise && !Promise.prototype.finally) Promise.prototype.finally = function (f) { return this.then(function (v) { f(); return v; }, function (e) { f(); throw e; }); };
  var shown = 0;
  function show(msg) {
    if (shown++ > 2 || !document.body) return;
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#3a0d14;color:#ffd6dc;border:1px solid #ff4d6d;border-radius:12px;padding:10px 12px;font:12px/1.35 sans-serif;word-break:break-word');
    d.textContent = 'Forja tuvo un error: ' + msg + ' — toca para cerrar y envía una captura.';
    d.onclick = function () { d.parentNode && d.parentNode.removeChild(d); };
    document.body.appendChild(d);
  }
  window.addEventListener('error', function (e) { show((e.message || 'desconocido') + (e.lineno ? ' (línea ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('promesa: ' + (r && r.message || r)); });
})();
</script>
<style>
@font-face{font-family:'Poppins';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/inter-latin-800-normal.woff2) format('woff2')}
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
.sync{display:none!important}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ok)} .switch.on i{left:21px}
.remrow{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.remrow.off{opacity:.55}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;width:1px;height:1px}
.daypick span{display:flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--line);font-weight:700}
.daypick input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.daypick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* Layout: app de una columna (máx 560px), barra inferior fija, temporizador flotante; modo reloj = una serie por pantalla.
   Color por grupo muscular como los discos olímpicos: verde piernas, rojo empuje, azul tracción; acento amarillo de disco de 15 kg. */
:root{
  --bg:#121519; --surface:#1a1e24; --surface2:#232931; --line:#303740;
  --fg:#e8ebee; --muted:#97a0aa; --accent:#f2c230; --accent-ink:#1d1700;
  --legs:#41b06d; --push:#e5574e; --pull:#4f93e3; --ok:#41b06d; --bad:#e5574e;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Roboto Mono",monospace;
  --r:12px;
  --core:#c98bf0;
  --flame:#ff7a1a; --flame2:#ffa62b; --flame-core:#ffe08a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:12px 150px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:19px;font-weight:700}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.t-Piernas{--tc:var(--legs)} .t-Empuje{--tc:var(--push)} .t-Tracción{--tc:var(--pull)} .t-Core{--tc:var(--core)}
.dot[class*="t-"]{background:var(--tc)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:700;background:var(--surface2);border:1px solid var(--line);min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.icon-btn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:var(--surface2);flex:none}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync .dot{background:var(--muted)} .sync.cloud .dot{background:var(--ok)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
/* figuras de técnica */
:root{--eq:#6d7783;--eq2:#2a3038}
.fig-svg{width:100%;height:auto;display:block;--hl:var(--tc)}
.fig{background:var(--surface2);border-radius:12px;padding:8px;border:1px solid var(--line)}
.fig-ctrl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fig-ctrl .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.how-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how-list.bad li::marker{color:var(--bad)}
.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.guide button{text-align:left;padding:8px;gap:6px}
.guide .fig{padding:4px}
.guide .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.how-btn{color:var(--accent)}
.vid{color:var(--fg);font-weight:600}
.nav button{padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:22px;height:22px}

/* day cards */
.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.wd{font-family:var(--f-display);font-weight:800;font-size:22px;width:52px;height:52px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.day.next .wd{background:var(--accent);color:var(--accent-ink)}
.bars{display:flex;gap:3px;margin-top:6px}
.bars i{height:5px;flex:1;border-radius:3px;background:var(--tc)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:38px;text-transform:uppercase;line-height:1}

/* session */
.sess-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.ex{border-left:4px solid var(--tc)}
.ex.complete{opacity:.75}
.target{display:flex;flex-wrap:wrap;gap:6px}
.sugg{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface2);display:flex;gap:8px;align-items:flex-start}
.sugg.up{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.sugg b{color:var(--fg)}
.sets{display:grid;grid-template-columns:40px 58px 1fr 1fr 44px;gap:7px;align-items:center}
.prev{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-size:13px;line-height:1.1;padding:2px}
.prev small{font-size:11px}
button.prev:active{background:var(--surface2)}
.prev.none{border-color:transparent}
.w-prev{font-size:13px;color:var(--muted);padding:6px 10px;border-radius:16px;border:1px dashed var(--line)}
.w-prev b{color:var(--fg)}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.fig-mini{flex:none;width:118px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);padding:2px}
.fig-mini .fig-svg{--hl:var(--tc)}
.w-fig{display:flex;justify-content:center}
.w-fig .fig-mini{width:120px}
.vids{display:flex;flex-direction:column;gap:10px}
.vidcard{display:flex;flex-direction:column;gap:6px}
.vidcard video{width:100%;max-height:60vh;border-radius:10px;background:#000}
a.btn{color:var(--fg);text-decoration:none}
.speeds{display:flex;gap:6px;flex-wrap:wrap}
.spd{padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:12.5px;font-weight:700;font-family:var(--f-num)}
.spd.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.coach{font-size:13px;padding:9px 11px;border-radius:9px;background:var(--surface2);display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--muted)}
.coach.up{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-left-color:var(--ok)}
.coach.down,.coach.pain{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-left-color:var(--bad)}
.coach.back{border-left-color:var(--pull)}
.coach-h{display:flex;gap:8px;align-items:flex-start}
.coach ul{margin:0;padding-left:30px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.coach ul b{color:var(--fg)}
.coach-card{gap:10px}
.coach-rows{display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:10px;padding-block:7px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow b{display:block;font-size:13.5px}
.crow small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .num{font-weight:700;white-space:nowrap}
.cic{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--surface2);color:var(--muted)}
.crow.up .cic{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ok)}
.crow.down .cic,.crow.pain .cic{background:color-mix(in srgb,var(--bad) 22%,var(--surface));color:var(--bad)}
.picklist{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.pick b{display:block;font-size:14px}
.pick small{display:block;font-size:12px}
.pfig{width:84px;flex:none;padding:0!important;background:var(--surface)!important}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:6px 10px;border-radius:10px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted)}
.tag.on{color:#0b0d12;border-color:transparent}
.tag-easy.on,.tag-up.on{background:var(--ok)}
.tag-hard.on,.tag-fail.on,.tag-tech.on{background:var(--warn)}
.tag-down.on,.tag-pain.on{background:var(--bad);color:#fff}
.note-hint{font-size:12.5px;margin-top:6px}
.h-ok{color:var(--ok)} .h-warn{color:var(--warn)} .h-bad{color:var(--bad)}
.refg{color:var(--pull)}
.barinfo{font-size:12.5px;padding:8px 10px;border-radius:10px;background:rgba(77,163,255,.08);border:1px solid rgba(77,163,255,.22);color:var(--muted)}
.barinfo b{color:var(--pull)}
.rest-chip{gap:4px;padding:2px 4px}
.rest-chip button{width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:800;line-height:1}
.note-prev{display:flex;gap:8px;font-size:13px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-left:3px solid var(--accent)}
.note-in{font:inherit;font-size:14px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical;min-height:44px;-webkit-user-select:text;user-select:text}
.drop-n{display:flex;flex-direction:column;align-items:center;gap:2px}
.drop-n .rir{color:var(--push);font-weight:800}
.drop-x{width:22px;height:22px;border-radius:50%;font-size:11px;color:var(--muted);border:1px solid var(--line)}
.drop-in{border-style:dashed!important;border-color:color-mix(in srgb,var(--push) 55%,var(--line))!important}
.drop-btn{color:var(--push)}
.dropt{color:var(--push);font-weight:600}
.note-h{color:var(--muted);font-size:12.5px;text-align:left!important;font-family:var(--f-body)!important;border-top:0!important;padding-top:0!important}
.stepper{display:grid;grid-template-columns:52px 1fr auto 52px;gap:8px;align-items:center}
.stepper button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:800}
.stepper input{text-align:center;font-family:var(--f-num)}
.streak-card{gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--flame) 16%,var(--surface)),var(--surface) 60%);border-color:color-mix(in srgb,var(--flame) 35%,var(--line))}
.streak-card.cold{background:var(--surface);border-color:var(--line)}
.flame{width:44px;height:55px;flex:none;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--flame) 45%,transparent))}
.flame.off{filter:grayscale(1);opacity:.4}
.flame.mini{width:16px;height:20px;filter:none}
.flame.big{width:110px;height:138px}
.streak-n{font-size:40px;font-weight:700;line-height:1;color:var(--flame)}
.cold .streak-n{color:var(--muted)}
.frz{font-size:12.5px;margin-top:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.wkd i{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;border:2px solid transparent}
.wkd.plan i{border:2px dashed var(--line)}
.wkd.on i{background:color-mix(in srgb,var(--flame) 22%,var(--surface));border-color:var(--flame)}
.wkd.today span{color:var(--fg)}
.wkd.today i{box-shadow:0 0 0 2px var(--fg)}
.celebrate{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 90%,transparent);display:flex;align-items:center;justify-content:center;padding-inline:16px;backdrop-filter:blur(6px)}
.cel-in{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.cel-n{font-size:72px;font-weight:700;line-height:1;color:var(--flame)}
.cel-t{font-family:var(--f-display);font-size:30px;font-weight:800;text-transform:uppercase;line-height:1.05}
.cel-s{color:var(--muted);font-size:14px}
.cel-in .wk{width:100%;margin-block:8px}
@media (prefers-reduced-motion:no-preference){.flame.big{animation:flame-pop .9s cubic-bezier(.2,1.6,.4,1) both,flame-flick 1.6s ease-in-out .9s infinite}.cel-n{animation:num-up .7s .25s both}}
@keyframes flame-pop{from{transform:scale(.2) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes flame-flick{50%{transform:scale(1.05) rotate(-2deg)}}
@keyframes num-up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.gymbar{display:flex;flex-shrink:0;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.gymbar::-webkit-scrollbar{display:none}
.gchip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;white-space:nowrap}
.gchip.on{background:var(--fg);color:var(--bg);border-color:transparent}
.gchip.add{color:var(--muted);border-style:dashed;font-weight:600}
.kind{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.k-fuerza{background:color-mix(in srgb,var(--push) 22%,transparent);color:var(--push)}
.k-bombeo{background:color-mix(in srgb,var(--pull) 22%,transparent);color:var(--pull)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:4px}
.gtag{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
@media (max-width:360px){.sets{grid-template-columns:34px 50px 1fr 1fr 40px;gap:5px}}
.rir{display:block;font-size:10px;letter-spacing:.04em;color:var(--muted);font-family:var(--f-body);font-weight:600}
.remind{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));font-size:13.5px}
.sups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sup{display:flex;gap:8px;align-items:center;text-align:left;padding:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);min-width:0}
.sup small{display:block;color:var(--muted);font-size:11.5px}
.sup b{font-size:13px}
.sup .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sup.on{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.sup.on .box{background:var(--ok);border-color:transparent;color:#fff}
.streak{background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}
.water{display:flex;flex-direction:column;gap:8px}
.wbar{position:relative;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.wbar i{position:absolute;inset:0 auto 0 0;background:var(--pull);border-radius:6px}
.wbar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.5}
.calc-t{width:100%;border-collapse:collapse;font-size:13px}
.calc-t td{padding:4px 0;border-top:1px solid var(--line)}
.calc-t td:last-child{text-align:right;font-family:var(--f-num)}
.rec td{padding:6px 0;border-top:1px solid var(--line);font-size:13px;vertical-align:top}
.rec td:nth-child(2){text-align:right;font-family:var(--f-num);white-space:nowrap}
.rec small{display:block;color:var(--muted);font-size:11.5px}
.up-pct{color:var(--ok);font-weight:700}
.prof{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.prof .v{font-family:var(--f-num);font-weight:700;font-size:17px}
.supgrid{display:grid;grid-template-columns:70px repeat(14,1fr);gap:3px;align-items:center;font-size:11px}
.supgrid i{aspect-ratio:1;border-radius:3px;background:var(--surface2);max-width:100%}
.supgrid i.on{background:var(--ok)} .supgrid i.half{background:color-mix(in srgb,var(--pull) 55%,var(--surface2))} .supgrid i.full{background:var(--pull)}
@media (max-width:380px){.sups{grid-template-columns:1fr}.prof{grid-template-columns:repeat(2,1fr)}}
.sets .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.sets input{text-align:center;font-family:var(--f-num);font-size:17px;padding:9px 4px}
.sets .n{font-family:var(--f-num);color:var(--muted);text-align:center}
.check{width:44px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.check.on{background:var(--ok);border-color:transparent;color:#fff}
.done-row input{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25;padding-inline:16px;pointer-events:none}
.rest-in{max-width:560px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.rest-in .t{font-family:var(--f-num);font-size:28px;font-weight:700;min-width:84px}
.rest-in.go{background:var(--accent);color:var(--accent-ink)}
.rest-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 30%,transparent);overflow:hidden;margin-top:4px}
.rest-bar i{display:block;height:100%;background:var(--accent)}
.rest-in .btn{background:transparent;border-color:currentColor;color:inherit;min-height:34px;padding:4px 10px}

/* plans */
.ex-line{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.ex-line:first-of-type{border-top:0}
.ex-line .o{font-family:var(--f-num);color:var(--muted);font-size:12px}
.ex-line .meta{font-size:12.5px;color:var(--muted)}
.edit-tools{display:flex;gap:4px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding-inline:0}
.sheet-card{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--f-num);font-size:22px;font-weight:700}
.vol-row{display:grid;grid-template-columns:76px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.vol-track{position:relative;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.vol-track .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 18%,transparent);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.vol-track .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--tc)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* history */
.hist summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.hist summary::-webkit-details-marker{display:none}
.hist table{width:100%;border-collapse:collapse;font-size:13px}
.hist td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.hist td:last-child{text-align:right;font-family:var(--f-num)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}

/* ===== Modo reloj ===== */
.watch body,body.watch{font-size:14px;padding-inline:10px}
body.watch .app{padding-block:14px 20px;gap:10px;max-width:420px;text-align:center}
body.watch .nav{display:none}
body.watch .rest{bottom:0;padding-inline:0}
body.watch .rest-in{border-radius:0;flex-direction:column;gap:6px;min-height:100%;justify-content:center}
.w-ex{font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.w-set{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.w-val{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:6px}
.w-val .v{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1}
.w-val .u{font-size:11px;color:var(--muted);display:block;letter-spacing:.08em}
.w-val button{height:48px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:24px;font-weight:700}
.w-go{height:56px;border-radius:28px;background:var(--ok);color:#fff;font-weight:800;font-size:18px;width:100%}
.w-nav{display:flex;justify-content:space-between;gap:8px}
.w-nav button{flex:1;padding:10px 0;border-radius:20px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:13px}
.w-hint{font-size:12px;color:var(--muted)}
.w-rest .t{font-size:44px}
@media (max-width:330px){ .tiles{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .check,.btn,.nav button{transition:background .15s,color .15s} }

<script>
/* ================== Biblioteca de técnica con figuras animadas ================== */
const FIGLEN = { torso: 44, thigh: 38, shin: 36, foot: 11, uarm: 26, farm: 24 };
const rad = a => a * Math.PI / 180;
const fadd = (p, a, l) => [p[0] + Math.cos(rad(a)) * l, p[1] + Math.sin(rad(a)) * l];
const f1 = n => n.toFixed(1);
function fik(P, T, a, b, s) {
  const dx = T[0] - P[0], dy = T[1] - P[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const D = Math.min(Math.max(d, Math.abs(a - b) + 0.5), a + b - 0.01);
  const x = (a * a - b * b + D * D) / (2 * D), h = Math.sqrt(Math.max(0, a * a - x * x));
  return [[P[0] + ux * x - s * uy * h, P[1] + uy * x + s * ux * h], [P[0] + ux * D, P[1] + uy * D]];
}
/* utilería de equipo */
const fL = (a, b, w, c = 'var(--eq)') => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const fC = (p, r, f = 'var(--eq2)', s = 'var(--eq)') => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${f}" stroke="${s}" stroke-width="1.5"/>`;
const fR = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--eq2)" stroke="var(--eq)" stroke-width="1.5"/>`;
const fBar = (c, ang, len, w, col) => fL(fadd(c, ang, -len / 2), fadd(c, ang, len / 2), w, col);
const fFloor = (y = 141) => fL([8, y], [192, y], 2, 'var(--line)');
const fPlate = p => fC(p, 11) + fC(p, 2.5, 'var(--eq)');
const fDumb = (c, ang) => fBar(c, ang, 14, 3.5) + fC(fadd(c, ang, 7), 3.5) + fC(fadd(c, ang, -7), 3.5);
function fShinPad(p) {
  const dx = p.ankle[0] - p.knee[0], dy = p.ankle[1] - p.knee[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  return fC([p.ankle[0] - ux * 4 + uy * 7, p.ankle[1] - uy * 4 - ux * 7], 5.5);
}

function fSolve(def, q) {
  if (def.rig === 'front') {
    const h = q.hip, sh = [h[0], h[1] - 44], tl = def.thighLen || 38;
    const p = { rig: 'front', hip: h, sh, head: [h[0], sh[1] - 14], shL: [h[0] - 12, sh[1]], shR: [h[0] + 12, sh[1]], hipL: [h[0] - 8, h[1]], hipR: [h[0] + 8, h[1]] };
    p.kneeL = fadd(p.hipL, q.tL, tl); p.ankleL = fadd(p.kneeL, q.sL, 36);
    p.kneeR = fadd(p.hipR, q.tR, tl); p.ankleR = fadd(p.kneeR, q.sR, 36);
    p.elbowL = fadd(p.shL, q.uL, 26); p.handL = fadd(p.elbowL, q.fL, 24);
    p.elbowR = fadd(p.shR, q.uR, 26); p.handR = fadd(p.elbowR, q.fR, 24);
    p.fLa = q.fL; p.fRa = q.fR;
    return p;
  }
  const hip = q.hip, sh = fadd(hip, q.torso, FIGLEN.torso), head = fadd(sh, q.torso, 13);
  const [knee, ankle] = fik(hip, q.ankle, FIGLEN.thigh, FIGLEN.shin, def.k);
  const toe = fadd(ankle, q.foot || 0, FIGLEN.foot);
  const tgt = q.hand || [sh[0] + q.handRel[0], sh[1] + q.handRel[1]];
  const [elbow, hand] = fik(sh, tgt, FIGLEN.uarm, FIGLEN.farm, def.e);
  return { rig: 'side', hip, sh, head, knee, ankle, toe, elbow, hand };
}
const FIG_ANG = { torso: 1, foot: 1, uL: 1, fL: 1, uR: 1, fR: 1, tL: 1, sL: 1, tR: 1, sR: 1 };
function fLerp(A, B, t) {
  const o = {};
  for (const k in A) {
    if (Array.isArray(A[k])) o[k] = A[k].map((v, i) => v + (B[k][i] - v) * t);
    else if (typeof A[k] === 'number') { let d = B[k] - A[k]; if (FIG_ANG[k]) d = ((d % 360) + 540) % 360 - 180; o[k] = A[k] + d * t; }  /* ángulos: por el camino corto */
    else o[k] = A[k];
  }
  return o;
}
/* Movimiento en arco alrededor de una articulación fija (codo en curls, rodilla en extensiones) */
function fArc(d, q, t) {
  const p0 = fSolve(d, d.A);
  (d.arc || []).forEach(part => {
    const c = part === 'hand' ? p0.elbow : p0.knee, A = d.A[part], B = d.B[part]; if (!A || !B) return;
    const a0 = Math.atan2(A[1] - c[1], A[0] - c[0]), a1 = Math.atan2(B[1] - c[1], B[0] - c[0]);
    let da = a1 - a0; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    const r0 = Math.hypot(A[0] - c[0], A[1] - c[1]), r1 = Math.hypot(B[0] - c[0], B[1] - c[1]), a = a0 + da * t, r = r0 + (r1 - r0) * t;
    q[part] = [c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r];
  });
  return q;
}
function fBody(p, hi, ghost) {
  const col = s => (!ghost && hi.includes(s)) ? 'var(--hl)' : 'var(--fg)';
  let s = '';
  if (p.rig === 'side') {
    s += fL(p.hip, p.knee, 9.5, col('thigh')) + fL(p.knee, p.ankle, 7.5, col('shin')) + fL(p.ankle, p.toe, 5, 'var(--fg)');
    s += fL(p.hip, p.sh, 12, col('torso'));
    if (!ghost && hi.includes('glute')) s += `<circle cx="${f1(p.hip[0])}" cy="${f1(p.hip[1])}" r="7.5" fill="var(--hl)"/>`;
    s += `<circle cx="${f1(p.head[0])}" cy="${f1(p.head[1])}" r="8.5" fill="var(--fg)"/>`;
    s += fL(p.sh, p.elbow, 7.5, col('uarm')) + fL(p.elbow, p.hand, 6, col('farm'));
    if (!ghost && hi.includes('delt')) s += `<circle cx="${f1(p.sh[0])}" cy="${f1(p.sh[1])}" r="6.5" fill="var(--hl)"/>`;
  } else {
    for (const sd of ['L', 'R']) s += fL(p['hip' + sd], p['knee' + sd], 9, col('thigh')) + fL(p['knee' + sd], p['ankle' + sd], 7.5, col('shin'));
    s += fL(p.hip, p.sh, 22, col('torso')) + fL(p.hipL, p.hipR, 10, col('torso')) + fL(p.shL, p.shR, 8, col('torso'));
    if (!ghost && hi.includes('glute')) s += fC(p.hipL, 6, 'var(--hl)', 'none') + fC(p.hipR, 6, 'var(--hl)', 'none');
    s += `<circle cx="${f1(p.head[0])}" cy="${f1(p.head[1])}" r="8.5" fill="var(--fg)"/>`;
    for (const sd of ['L', 'R']) s += fL(p['sh' + sd], p['elbow' + sd], 7, col('uarm')) + fL(p['elbow' + sd], p['hand' + sd], 6, col('farm'));
    if (!ghost && hi.includes('delt')) s += fC(p.shL, 6, 'var(--hl)', 'none') + fC(p.shR, 6, 'var(--hl)', 'none');
  }
  return ghost ? `<g opacity=".2">${s}</g>` : s;
}
function figSVG(item, t, ghost = true) {
  const d = item.fig, p = fSolve(d, fArc(d, fLerp(d.A, d.B, t), t));
  const g = ghost ? fBody(fSolve(d, d.A), [], true) : '';
  return `<svg viewBox="${d.vb || '0 0 200 150'}" class="fig-svg t-${item.type}" role="img" aria-label="Figura: ${item.name}">${d.back ? d.back(p) : ''}${g}${fBody(p, d.hi || [], false)}${d.front ? d.front(p) : ''}</svg>`;
}

const ROW_FIG = {
  k: -1, e: 1, hi: ['torso', 'uarm'],
  A: { hip: [60, 116], torso: -68, ankle: [130, 124], hand: [112, 104], foot: -80 },
  B: { hip: [60, 116], torso: -96, ankle: [130, 124], hand: [80, 100], foot: -80 },
  back: () => fFloor() + fL([186, 22], [186, 140], 6) + fC([186, 112], 5) + fL([38, 122], [78, 122], 6) + fL([58, 122], [58, 140], 4) + fBar([136, 116], -80, 26, 5),
  front: p => fL(p.hand, [186, 112], 1.5) + fBar(p.hand, 90, 9, 4),
};

const LIB = [
  { key: 'prensa', name: 'Prensa 45°', type: 'Piernas', re: /prensa/, musc: ['Cuádriceps', 'Glúteos'],
    steps: ['Espalda y glúteos bien pegados al respaldo. Pies en el centro de la plataforma, a la anchura de los hombros.', 'Quita los seguros y baja controlando (2-3 s) hasta que las rodillas formen unos 90°.', 'Empuja con todo el pie, talón incluido, hasta casi estirar las piernas sin bloquear las rodillas.', 'Respira: toma aire al bajar y suéltalo al empujar.'],
    errs: ['Bajar tanto que la cadera se despega del asiento y la espalda baja se redondea.', 'Rodillas que se cierran hacia adentro al empujar.', 'Bloquear las rodillas de golpe arriba.'],
    fig: { k: -1, e: 1, hi: ['thigh', 'glute'],
      A: { hip: [70, 110], torso: -125, ankle: [124, 59], hand: [80, 110], foot: -130 },
      B: { hip: [70, 110], torso: -125, ankle: [112, 72], hand: [80, 110], foot: -130 },
      back: () => fFloor() + fL([94, 132], [184, 42], 5) + fL([64, 116], [37, 78], 8) + fL([62, 119], [86, 119], 6) + fL([75, 119], [75, 140], 4),
      front: p => fBar(fadd(p.ankle, -45, 5), 45, 40, 6) } },
  { key: 'hack', name: 'Sentadilla Hack', type: 'Piernas', re: /hack/, musc: ['Cuádriceps', 'Glúteos'],
    steps: ['Espalda y hombros firmes contra las almohadillas. Pies algo adelantados, a la anchura de la cadera.', 'Quita los seguros y baja en 2-3 s hasta que los muslos queden paralelos a la plataforma.', 'Sube empujando desde los talones; las rodillas siguen la dirección de las puntas de los pies.'],
    errs: ['Levantar los talones de la plataforma.', 'Rebotar abajo en lugar de controlar.', 'Despegar la espalda de la almohadilla.'],
    fig: { k: -1, e: 1, hi: ['thigh', 'glute'],
      A: { hip: [100, 66], torso: -112, ankle: [120, 135], handRel: [9, 3], foot: -12 },
      B: { hip: [110.5, 92], torso: -112, ankle: [120, 135], handRel: [9, 3], foot: -12 },
      back: p => fFloor() + fL([66, 18], [112, 128], 5) + fL(fadd(p.hip, 158, 7), fadd(fadd(p.sh, -112, 6), 158, 7), 8),
      front: p => fC(fadd(p.sh, -22, 7), 5) + fBar([126, 138], -15, 36, 5) } },
  { key: 'hipthrust', name: 'Hip Thrust', type: 'Piernas', re: /hip thrust|empuje de cadera/, musc: ['Glúteos', 'Isquiotibiales'],
    steps: ['Apoya la parte alta de la espalda en el borde del banco. Barra con almohadilla sobre la cadera.', 'Pies planos en el suelo, a la anchura de la cadera, de modo que arriba las rodillas queden a 90°.', 'Sube la cadera apretando los glúteos hasta alinear hombros, cadera y rodillas. Pausa 1 s.', 'Mentón recogido y mirada al frente durante todo el movimiento.'],
    errs: ['Arquear la zona lumbar en vez de subir con los glúteos.', 'Empujar con la punta de los pies (empuja con los talones).'],
    fig: { k: -1, e: 1, hi: ['glute'],
      A: { hip: [92, 128], torso: -151.6, ankle: [132, 138], hand: [93, 118], foot: 0 },
      B: { hip: [98, 104], torso: -185.3, ankle: [132, 138], hand: [99, 94], foot: 0 },

      const pl = state.plans.find(p => p.id === state.draft.planId), dy = pl && pl.days.find(x => x.id === state.draft.dayId), pe = dy && dy.exercises.find(x => x.id === e.exId);

    case 'plan-new': textSheet('Nuevo plan', 'Nombre del plan', '', v => { const np = { id: uid(), name: v, gymId: activeGym().id, days: [{ id: uid(), name: 'Día 1', weekday: 1, kind: 'fuerza', exercises: [] }] }; state.plans.push(np); state.editPlan = np.id; }); break;
    case 'reset-plans': if (prevConfirm === 'reset') { const gid = activeGym().id; const fresh = applyRev2(defaultPlans()).map(p => { p.gymId = 'rokaz'; p.days.forEach(d => d.kind = kindOfName(d.name)); return gid === 'rokaz' ? p : clonePlanFor(p, gid); }); state.plans = state.plans.filter(p => p.gymId !== gid).concat(fresh); state.settings.planByGym = Object.assign({}, state.settings.planByGym, { [gid]: fresh[0].id }); state.confirm = null; savePlans(); render(); toast('Planes originales restaurados.'); } else { state.confirm = 'reset'; render(); } break;
    case 'gym': state.settings.activeGymId = b.dataset.gym; state.editPlan = null; saveLocal(); render(); break;
    case 'gym-new': gymSheet(); break;
    case 'gym-rename': { const g = activeGym(); textSheet('Renombrar gimnasio', 'Nombre', g.name, v => { g.name = v; LS.set('gyms', state.gyms); }); break; }
    case 'gym-del': { const g = activeGym(); if (prevConfirm === 'gdel-' + g.id) { state.gyms = state.gyms.filter(x => x.id !== g.id); state.plans = state.plans.filter(p => p.gymId !== g.id); state.settings.activeGymId = state.gyms[0].id; state.confirm = null; saveGyms(); render(); toast(`${g.name} borrado. Su historial se conserva.`); } else { state.confirm = 'gdel-' + g.id; render(); } break; }
    case 'gfilter': state.gymFilter = b.dataset.gym; render(); break;
    case 'use-prev': { const e = state.draft.exercises[+b.dataset.ex], j = +b.dataset.set, pv = (e.prev || [])[j]; if (!pv) break;
      if (b.dataset.k != null) { const k = +b.dataset.k, pd = (pv.drops || [])[k], dr = (e.log[j].drops || [])[k]; if (pd && dr && !dr.done) { dr.w = pd.w; dr.r = pd.r; } }
      else if (!e.log[j].done) { e.log[j].w = pv.w; e.log[j].r = pv.r; }
      saveDraft(); render(); break; }
    case 'sess-del': { const id = b.dataset.id; if (prevConfirm === 'sdel-' + id) { state.sessions = state.sessions.filter(s => s.id !== id); state.confirm = null; saveLocal(); cloud.delSession(id); render(); } else { state.confirm = 'sdel-' + id; b.textContent = '¿Borrar? Toca otra vez'; ev.preventDefault(); } break; }
    case 'sheet-close': state.confirm = null; figAnim.item = null; closeSheet(); break;
    case 'how': howSheet(b.dataset.name); break;
    case 'note-tag': { const e = state.draft.exercises[+b.dataset.ex], t = NOTE_TAGS.find(x => x.k === b.dataset.tag); if (!t) break;
      const cur = String(e.note || '').trim();
      if (noteHas(cur, t)) e.note = cur.replace(new RegExp('\\s*' + t.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\.?', 'i'), '').trim();
      else e.note = (cur ? cur.replace(/[.\s]*$/, '') + '. ' : '') + t.text.charAt(0).toUpperCase() + t.text.slice(1) + '.';
      saveDraft(); render(); break; }
    case 'guide-g': state.guideGroup = b.dataset.g; state.guideQ = ''; render(); break;
    case 'lib-pick': libPicker(b.dataset.plan, b.dataset.day, b.dataset.k === '' ? null : +b.dataset.k); break;
    case 'lib-g': state.pickG = b.dataset.g; renderPicker(); break;
    case 'lib-choose': { const x = LIB.find(l => l.key === b.dataset.key); const ctx = state.pickCtx; if (!x || !ctx) break;
      const [a, bb] = String(x.reps || '10-12').split('-').map(n => parseInt(n)); const isTime = /s$/.test(String(x.reps || ''));
      exSheet(ctx.pid, ctx.did, ctx.k, { name: x.name, type: x.type, repsMin: a || 10, repsMax: bb || a || 12, rest: x.rest || 90, bar: BAR_DEFAULT[x.name] || 0, weight: isTime || x.type === 'Core' ? 0 : (ctx.k != null ? undefined : 10) });
      break; }
    case 'fx-step': { const inp = document.getElementById('fx-r'); const v = Math.min(600, Math.max(10, (Math.round((+inp.value || 60) / 10) * 10) + +b.dataset.d)); inp.value = v; document.getElementById('fx-r-txt').textContent = clock(v); break; }
    case 'sup': { const t = today(); t[b.dataset.k] = !t[b.dataset.k]; t.edited = Date.now(); saveDaily(); render(); if (t[b.dataset.k] && b.dataset.k === 'crea') toast(`Creatina registrada · ${creaStreak()} días seguidos`); break; }
    case 'water': { const t = today(); t.water = Math.max(0, (t.water || 0) + +b.dataset.ml); t.edited = Date.now(); saveDaily(); render(); if (+b.dataset.ml > 0 && t.water >= WATER_MIN && t.water - +b.dataset.ml < WATER_MIN) toast('¡Meta de agua cumplida! 💧'); break; }
    case 'fig-play': if (!figAnim.playing) { figAnim.playing = true; figAnim.t0 = performance.now(); requestAnimationFrame(figLoop); } figCtrl(); break;
    case 'fig-a': figAnim.playing = false; figAnim.fixed = 0; figShow(0); figCtrl(); break;
    case 'fig-b': figAnim.playing = false; figAnim.fixed = 1; figShow(1); figCtrl(); break;
  }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { state.confirm = null; closeSheet(); } });
document.addEventListener('submit', ev => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === 'f-ex') {
    const fd = new FormData(f); const { d } = findDay(f.dataset.plan, f.dataset.day);
    const num = (k, def) => { const v = parseFloat(String(fd.get(k)).replace(',', '.')); return isFinite(v) ? v : def; };
    let a = Math.round(num('repsMin', 8)), bb = Math.round(num('repsMax', a)); if (bb < a) [a, bb] = [bb, a];
    const e = { name: String(fd.get('name')).trim(), type: fd.get('type'), weight: num('weight', 0), sets: Math.max(1, Math.round(num('sets', 3))), repsMin: a, repsMax: bb, rest: Math.min(600, Math.max(10, Math.round(num('rest', 60) / 10) * 10)), dropLast: !!fd.get('dropLast'), bar: Math.max(0, num('bar', 0)) };
    if (f.dataset.k !== '') Object.assign(d.exercises[+f.dataset.k], e); else d.exercises.push(Object.assign({ id: uid() }, e));
    savePlans(); closeSheet(); render(); toast('Ejercicio guardado.');
  }
  if (f.id === 'f-text') { const v = f.querySelector('#ft-v').value.trim(); if (!v) return; textSheet.cb(v, f); savePlans(); closeSheet(); render(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'pick-q') { state.pickQ = t.value; renderPicker(); return; }
  if (t.id === 'guide-q') { state.guideQ = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('guide-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } return; }
  if (t.id === 'calc-w' || t.id === 'calc-r') { state[t.id === 'calc-w' ? 'calcW' : 'calcR'] = t.value; $('#calc-out').innerHTML = calcOut(); return; }
  if (t.dataset.f && t.dataset.ex != null && state.draft) {
    if (t.dataset.f === 'note') { state.draft.exercises[+t.dataset.ex].note = t.value; saveDraft(); const h = document.getElementById('note-hint-' + t.dataset.ex); if (h) h.innerHTML = noteHint(t.value); return; }
    const m = state.draft.exercises[+t.dataset.ex].log[+t.dataset.set];
    const s = t.dataset.k != null ? (m.drops || [])[+t.dataset.k] : m; if (!s) return;
    const v = t.value.replace(',', '.'); s[t.dataset.f] = v === '' ? null : (isFinite(+v) ? +v : s[t.dataset.f]); saveDraft();
  }
});
document.addEventListener('change', ev => {
  if (ev.target.classList && ev.target.classList.contains('sess-date')) {
    const s = state.sessions.find(x => x.id === ev.target.dataset.id), v = ev.target.value;
    if (s && /^\d{4}-\d{2}-\d{2}$/.test(v)) { const old = new Date(s.date), [y, m, dd] = v.split('-').map(Number); const nd = new Date(old); nd.setFullYear(y, m - 1, dd); s.date = nd.toISOString(); state.sessions.sort((a, b) => b.date.localeCompare(a.date)); saveLocal(); toast('Fecha actualizada.'); render(); }
    return;
  }
  if (ev.target.id === 'sel-ex') { state.progEx = ev.target.value; render(); } });
addEventListener('resize', () => { if (state.settings.watch === null) safeRender(); });

const hadPlans = !!LS.get('plans', null);
const hadGyms = !!LS.get('gyms', null);
if (migratePlans() && hadPlans) toast('Planes actualizados: Curl Femoral y Face Pull agregados.');
migrateGyms();
if (!state.settings.dropRev) { state.plans.forEach(p => p.days.forEach(d => d.exercises.forEach(e => { if (e.name === 'Extensión de Pierna') e.dropLast = true; }))); state.settings.dropRev = 1; savePlans(); }
/* Convención de barra: en ejercicios con barra se anota la suma de discos (antes el plan traía el total con barra de 20 kg) */
if (!state.settings.barRev) {
  const fix = ['Press Banca Inclinado (Barra)', 'Press Banca Plano (Barra)', 'Remo con Barra'];
  state.plans.forEach(p => p.days.forEach(d => d.exercises.forEach(e => {
    if (BAR_DEFAULT[e.name] != null && e.bar == null) e.bar = BAR_DEFAULT[e.name];
    if (fix.includes(e.name) && e.weight > 20) e.weight = e.weight - 20;
  })));
  if (state.draft) state.draft.exercises.forEach(e => {
    if (BAR_DEFAULT[e.name] != null && e.bar == null) e.bar = BAR_DEFAULT[e.name];
    if (fix.includes(e.name)) { if (e.sugg && e.sugg.w > 20) e.sugg.w -= 20; e.log.forEach(x => { if (!x.done && x.w > 20) x.w -= 20; }); if (e.coach && e.coach.w > 20) { e.coach.w -= 20; e.coach.head = e.coach.head.replace(/(\d+(?:,\d+)?) kg/, m => fmtKg(parseFloat(m.replace(',', '.')) - 20) + ' kg'); } }
  });
  state.settings.barRev = 1; saveLocal(); saveDraft();
}
/* Sesión registrada en Symmetry: primera semana en Roka'z (piernas pesado, lunes 5 de octubre) */
if (!state.settings.importSym1) {
  if (!state.sessions.some(s => s.id === 'sym-rokaz-2026-10-05')) {
    state.sessions.push({ id: 'sym-rokaz-2026-10-05', date: new Date('2026-10-09T19:00:00-05:00').toISOString(), planId: 'plan2', planName: 'Torso / Pierna · 4 días', dayId: 'p2-lun', dayName: 'Piernas (Pesado)', gymId: 'rokaz', gymName: gymName('rokaz'), kind: 'fuerza', durationSec: 7080, source: 'Symmetry',
      exercises: [
        { name: 'Prensa 45°', type: P, sets: [{ w: 160, r: 18 }, { w: 170, r: 18 }, { w: 170, r: 18 }] },
        { name: 'Sentadilla Hack', type: P, note: 'Con mala técnica, dominar 60', sets: [{ w: 60, r: 12 }, { w: 60, r: 12 }, { w: 60, r: 12 }] },
        { name: 'Hip Thrust', type: P, sets: [{ w: 30, r: 15 }, { w: 30, r: 10 }, { w: 30, r: 11 }] },
        { name: 'Extensión de Pierna', type: P, sets: [{ w: 45, r: 14 }, { w: 45, r: 12 }, { w: 45, r: 12 }] },
        { name: 'Abducción de Cadera', type: P, sets: [{ w: 20, r: 10 }, { w: 20, r: 10 }, { w: 20, r: 10 }] },
      ] });
    state.sessions.sort((a, b) => b.date.localeCompare(a.date));
  }
  state.settings.importSym1 = 1; saveLocal();
}
if (hadPlans && !hadGyms) setTimeout(() => toast("Nuevo: elige tu gimnasio arriba. Raydac tiene una copia de tus rutinas."), 400);
render();
cloud.init();
</script>

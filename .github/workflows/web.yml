name: Publicar versión web
on:
  push:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Preparar la web
      run: |
        npm install --no-audit --no-fund
        mkdir -p www/fonts
        for w in 500 600 700 800; do cp "node_modules/@fontsource/poppins/files/poppins-latin-$w-normal.woff2" www/fonts/; done
        for w in 400 500 600 700 800; do cp "node_modules/@fontsource/inter/files/inter-latin-$w-normal.woff2" www/fonts/; done
        node ci/legacy.mjs www
        mkdir -p site && cp -r www/. site/ && cp docs/privacidad.html site/privacidad.html
        sed -i "s/forja-web-v1/forja-web-${GITHUB_SHA::8}/" site/sw.js
        touch site/.nojekyll
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - id: deploy
      uses: actions/deploy-pages@v4

name: Comprobar app Android (beta)
on:
  push:
    branches:
    - beta
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Compilar (sin publicar)
      env:
        BUILD_NUMBER: "1"
      run: bash ci/build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: Forja-beta
        path: Forja.apk
        retention-days: 7
